name: Build and publish Electron release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            platform: mac
            targets: dmg zip
          - os: windows-latest
            platform: win
            targets: nsis
          - os: ubuntu-latest
            platform: linux
            targets: AppImage deb

    steps:
      - name: Check out source
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install dependencies
        run: npm install
      - name: Build installers
        run: npm run dist -- --${{ matrix.platform }} ${{ matrix.targets }} --publish never
      - name: Upload build files
        uses: actions/upload-artifact@v4
        with:
          name: release-${{ matrix.platform }}
          path: release/*
          if-no-files-found: error
          retention-days: 7

  publish:
    name: Publish GitHub Release
    if: startsWith(github.ref, 'refs/tags/')
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Download all platform builds
        uses: actions/download-artifact@v4
        with:
          path: release-files
          merge-multiple: true
      - name: Attach files to GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: release-files/*
          generate_release_notes: true